<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>생일카페</title>

  <link rel="stylesheet" href="./assets/css/reset.css" />
  <link rel="stylesheet" href="./assets/css/theme.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/pages.css" />
</head>
<body>
  <div class="site-bg"></div>

  <div class="app-frame">
    <div class="frame-layer frame-layer-outer"></div>
    <div class="frame-layer frame-layer-inner"></div>

    <main class="screen">
      <section
        id="loading-screen"
        class="screen-panel loading-screen is-active"
        aria-live="polite"
      >
        <div class="loading-box pixel-panel">
          <img
            src="./assets/img/Loading.png"
            alt="로딩"
            class="loading-art"
          />
          <div class="loading-bar">
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
          </div>
        </div>
      </section>

      <section
        id="home-screen"
        class="screen-panel home-screen"
        aria-hidden="true"
      >
        <div class="home-stage">
          <header class="home-header">
            <img
              src="./assets/img/header.png"
              alt="생일카페 헤더"
              class="site-header-image"
            />
          </header>

          <nav class="home-menu" aria-label="메인 메뉴"></nav>
        </div>
      </section>
    </main>
  </div>

  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/loading.js"></script>
</body>
</html>
