<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>CR-bday-2026 LAB</title>
  <meta
    name="description"
    content="2026 이채령 생일카페 게임 UI 실험용 랩."
  />

  <link rel="stylesheet" href="./assets/css/reset.css" />
  <link rel="stylesheet" href="./assets/css/theme.css" />
  <link rel="stylesheet" href="./assets/css/app.css" />
</head>
<body>
  <div class="viewport-shell">
    <div class="scene-shell">
      <div class="app-frame">
        <div class="scene-bg"></div>
        <div class="frame-layer frame-layer-outer"></div>
        <div class="frame-layer frame-layer-inner"></div>

        <main class="screen">
          <section
            id="loading-screen"
            class="screen-panel loading-screen is-active"
            aria-live="polite"
          >
            <div class="loading-stage">
              <img
                id="loading-art"
                class="loading-art"
                src="./assets/anim/loading.gif"
                alt="로딩 애니메이션"
                width="2000"
                height="2000"
                decoding="async"
              />
            </div>
          </section>

          <section
            id="home-screen"
            class="screen-panel home-screen"
            aria-hidden="true"
          >
            <div class="home-stage">
              <div class="home-stage__header">
                <img
                  class="home-logo"
                  src="./assets/img/ui/loading-logo.png"
                  alt="로딩 605 로고"
                  width="142"
                  height="73"
                  decoding="async"
                />
              </div>

              <div class="home-stage__party" aria-label="캐릭터 4명">
                <img
                  class="party-character"
                  src="./assets/img/characters/char-1.png"
                  alt="캐릭터 1"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-2.png"
                  alt="캐릭터 2"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-3.png"
                  alt="캐릭터 3"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-4.png"
                  alt="캐릭터 4"
                  width="204"
                  height="204"
                  decoding="async"
                />
              </div>

              <div class="home-stage__status">
                <p class="status-caption" data-home-caption></p>
                <p class="status-copy" data-home-copy></p>
              </div>

              <nav class="menu-list" aria-label="메인 메뉴" data-home-menu></nav>

              <div class="home-stage__helper" data-home-helper></div>

              <div class="home-stage__footer">
                <p class="footer-chip">LAB BUILD</p>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script src="./assets/js/content.js"></script>
  <script src="./assets/js/scene.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/loading.js"></script>
</body>
</html>
