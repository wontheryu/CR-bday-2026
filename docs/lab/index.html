<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CR-bday-2026 · LAB</title>
  <meta name="description" content="CR-bday-2026 반응형(모바일/태블릿/PC) 레이아웃 실험실" />

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css?v=20260227_5" />
</head>

<body>
  <!-- Loading splash -->
  <div id="splash" class="splash" aria-label="인트로 화면">
    <div class="splash__inner">
      <img
        id="loadGif"
        class="splash__img"
        src="./assets/load-bit.gif"
        alt="Loading"
        width="2000"
        height="2000"
        decoding="async"
      />
    </div>
  </div>

  <!-- Header demo (shown after splash is removed) -->
  <div id="afterLoad" class="afterload" aria-label="헤더 데모">
    <div class="hero-header" aria-label="로딩 605 퍼센트 스타일의 레트로 헤더 프레임">
      <div class="hero-header__lang" aria-label="언어 선택">
        <button type="button" class="hero-header__lang-btn is-active" aria-pressed="true">KO</button>
        <span class="hero-header__lang-divider" aria-hidden="true">|</span>
        <button type="button" class="hero-header__lang-btn" aria-pressed="false">EN</button>
      </div>

      <div class="hero-header__image-wrap">
        <img
          class="hero-header__image"
          src="./assets/header.png"
          alt="LOADING 605 퍼센트 헤더"
          width="512"
          height="512"
          decoding="async"
        />
      </div>

      <div class="hero-header__frame" aria-hidden="true"></div>
    </div>
  </div>

  <!-- JS -->
  <script src="./app.js?v=20260227_5" defer></script>
</body>
</html>
