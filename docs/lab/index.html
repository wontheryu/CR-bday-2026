<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>CR-bday-2026 LAB</title>
  <meta
    name="description"
    content="2026 이채령 생일카페 게임 UI 실험용 랩."
  />

  <link rel="stylesheet" href="./assets/css/reset.css" />
  <link rel="stylesheet" href="./assets/css/theme.css" />
  <link rel="stylesheet" href="./assets/css/app.css" />
</head>
<body>
  <div class="viewport-shell">
    <div class="scene-shell">
      <div class="app-frame">
        <div class="scene-bg"></div>
        <div class="frame-layer frame-layer-outer"></div>
        <div class="frame-layer frame-layer-inner"></div>

        <main class="screen">
          <section
            id="loading-screen"
            class="screen-panel loading-screen is-active"
            aria-live="polite"
          >
            <div class="boot-stage">
              <div class="boot-stage__header">
                <img
                  class="home-logo"
                  src="./assets/img/ui/loading-logo.png"
                  alt="로딩 605 로고"
                  width="142"
                  height="73"
                  decoding="async"
                />
              </div>

              <div class="boot-stage__party" aria-label="캐릭터 4명">
                <img
                  class="party-character"
                  src="./assets/img/characters/char-1.png"
                  alt="캐릭터 1"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-2.png"
                  alt="캐릭터 2"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-3.png"
                  alt="캐릭터 3"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-4.png"
                  alt="캐릭터 4"
                  width="204"
                  height="204"
                  decoding="async"
                />
              </div>

              <div class="loading-meter">
                <p class="loading-meter__label">Loading...</p>
                <div class="loading-meter__frame" aria-hidden="true">
                  <span class="loading-meter__track"></span>
                </div>
              </div>
            </div>
          </section>

          <section
            id="home-screen"
            class="screen-panel home-screen"
            aria-hidden="true"
          >
            <div class="home-stage">
              <div class="home-stage__header">
                <img
                  class="home-logo"
                  src="./assets/img/ui/loading-logo.png"
                  alt="로딩 605 로고"
                  width="142"
                  height="73"
                  decoding="async"
                />
              </div>

              <div class="home-stage__party" aria-label="캐릭터 4명">
                <img
                  class="party-character"
                  src="./assets/img/characters/char-1.png"
                  alt="캐릭터 1"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-2.png"
                  alt="캐릭터 2"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-3.png"
                  alt="캐릭터 3"
                  width="204"
                  height="204"
                  decoding="async"
                />
                <img
                  class="party-character"
                  src="./assets/img/characters/char-4.png"
                  alt="캐릭터 4"
                  width="204"
                  height="204"
                  decoding="async"
                />
              </div>

              <div class="loading-meter loading-meter--ambient">
                <p class="loading-meter__label">Loading...</p>
                <div class="loading-meter__frame" aria-hidden="true">
                  <span class="loading-meter__track"></span>
                </div>
              </div>

              <nav class="menu-list" aria-label="메인 메뉴" data-home-menu></nav>

              <section class="home-stage__links" aria-label="공식 외부 링크">
                <p class="home-stage__links-title">OFFICIAL LINK</p>
                <div class="link-grid" data-home-links></div>
              </section>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script src="./assets/js/content.js"></script>
  <script src="./assets/js/scene.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/loading.js"></script>
</body>
</html>
